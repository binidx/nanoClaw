services:
  postgres:
    image: postgres:16-alpine
    container_name: nanoclaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_PG_USER:-nanoclaw}
      POSTGRES_PASSWORD: ${DB_PG_PASSWORD:-changeme_pg_password}
      POSTGRES_DB: ${DB_PG_DATABASE:-nanoclaw}
    volumes:
      - nanoclaw-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PG_USER:-nanoclaw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nanoclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: nanoclaw:local
    container_name: nanoclaw
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3377:3377"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --use-system-ca
      NANOCLAW_LOG_STDOUT: "true"
      TZ: ${TZ:-Asia/Shanghai}
      MAX_CONCURRENT_AGENTS: ${MAX_CONCURRENT_AGENTS:-5}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-1800000}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-1800000}
      DB_ENGINE: postgres
      DB_PG_HOST: postgres
      DB_PG_PORT: "5432"
      DB_PG_USER: ${DB_PG_USER:-nanoclaw}
      DB_PG_PASSWORD: ${DB_PG_PASSWORD:-changeme_pg_password}
      DB_PG_DATABASE: ${DB_PG_DATABASE:-nanoclaw}
      DB_PG_POOL_SIZE: ${DB_PG_POOL_SIZE:-20}
      DB_PG_SSL: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - nanoclaw-store:/app/store
      - nanoclaw-groups:/app/groups
      - nanoclaw-data:/app/data
      - nanoclaw-logs:/app/logs
      - nanoclaw-home-config:/home/nanoclaw/.config/nanoclaw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3377/readyz').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  nanoclaw-pgdata:
  nanoclaw-store:
  nanoclaw-groups:
  nanoclaw-data:
  nanoclaw-logs:
  nanoclaw-home-config:
